services:
  app:
    build: .
    container_name: flix_app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_NAME: ${APP_NAME:-Sistema FLIX}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_TZ: ${APP_TZ:-America/Asuncion}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-flix}
      DB_USER: ${POSTGRES_USER:-flix}
      DB_PASS: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env}
    volumes:
      # Desarrollo: el código se edita en vivo sin reconstruir la imagen
      - ./:/var/www/html
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: flix_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flix}
      POSTGRES_USER: ${POSTGRES_USER:-flix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env}
      TZ: ${APP_TZ:-America/Asuncion}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Se ejecutan solo la primera vez (volumen vacío), en orden alfabético
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Cliente web opcional:  docker compose --profile tools up -d
  adminer:
    image: adminer:latest
    container_name: flix_adminer
    profiles: ["tools"]
    depends_on:
      - db
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8081}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db

volumes:
  pgdata:
